<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crosses · Machine tag</title>
<meta name="description" content="You tapped a Crosses machine tag. Open the app to check in and start stringing.">
<meta name="theme-color" content="#F5F5F7">
<meta name="robots" content="noindex">
<!-- Share card: reuse the site's C2 · Light social preview. A machine tag's URL
     can get texted around; a clean preview points the recipient at the install. -->
<meta property="og:title" content="Crosses · Machine tag">
<meta property="og:description" content="You tapped a Crosses machine tag. Open the app to check in and start stringing.">
<meta property="og:image" content="https://crossesapp.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://crossesapp.com/og.png">
<!-- Favicon: the canonical woven "#" (matches brand/crosses-mark.svg and the main site).
     Ink flips to light on a dark tab bar so one file serves both, per the brand spec. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cstyle%3E.k{stroke:%23111114}@media(prefers-color-scheme:dark){.k{stroke:%23F3F3F5}}%3C/style%3E%3Cg fill='none' stroke-width='10' stroke-linecap='round'%3E%3Cline class='k' x1='16' y1='35' x2='84' y2='35'/%3E%3Cline class='k' x1='16' y1='65' x2='84' y2='65'/%3E%3Cline class='k' x1='35' y1='16' x2='35' y2='84'/%3E%3Cline x1='65' y1='16' x2='65' y2='84' stroke='%23FF4300'/%3E%3C/g%3E%3Cg fill='none' stroke-width='10' stroke-linecap='butt'%3E%3Cline class='k' x1='57' y1='35' x2='73' y2='35'/%3E%3Cline class='k' x1='27' y1='65' x2='43' y2='65'/%3E%3C/g%3E%3C/svg%3E">
<!-- App Store id: 6793786157 (bundle crosses.crosses-ios, team FYQ358R59X). Mirrors
     AppLinks.appStoreID in the crosses-ios repo, which spells it "id6793786157" because
     itms-apps URLs want the prefix and this meta tag does not.

     Still commented, and it has to stay that way until the app is actually on the App
     Store: today the listing exists only as an App Store Connect record, and
     https://apps.apple.com/app/id6793786157 is a dead page.

     The "Get Crosses" button below goes to the public TestFlight invite instead, which is
     a real install path — this is the screen someone lands on when they tap a machine's
     tag *without* the app, so it's the one place that most needs one.

     On publication day, uncomment the meta tag and repoint that button at the App Store
     URL (TestFlight builds expire; the listing won't):

       <meta name="apple-itunes-app" content="app-id=6793786157"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- impeccable-disable overused-font
     Matches the main site: Instrument Sans is the committed body face of the
     Crosses Landing v2 design system; Roboto is only a system fallback. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@500&display=swap">
<style>
  /* Light-only, matching the crossesapp.com "v2" design system:
     ink #111114 on off-white #F5F5F7, one accent orange for the live string in the
     mark, ink (not orange) for the primary action. */
  :root {
    color-scheme: light;
    --bg: #F5F5F7; --surface: #FFFFFF; --ink: #111114; --orange: #FF4300;
    --ink-64: rgb(17 17 20 / .64);   /* body — 5.5:1 on --bg */
    --ink-label: rgb(17 17 20 / .62);/* eyebrow — clears AA (the comp's fainter grey did not) */
    --line: rgb(17 17 20 / .12);
    --sans: 'Instrument Sans', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --display: Archivo, var(--sans);
    --mono: 'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(.23, 1, .32, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px; min-height: 100dvh;
  }
  ::selection { background: var(--orange); color: #fff; }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .logo { width: 40px; height: 40px; margin: 0 auto 24px; }
  .eyebrow {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: .22em; text-transform: uppercase; color: var(--ink-label); margin-bottom: 16px;
  }
  h1 {
    font-family: var(--display); font-weight: 500; font-size: 26px;
    letter-spacing: -.03em; line-height: 1.2; margin: 0 0 12px; text-wrap: balance;
  }
  p { color: var(--ink-64); margin: 0 auto 24px; max-width: 300px; text-wrap: pretty; }
  .token {
    font-family: var(--mono); font-size: 12px; color: var(--ink-64);
    letter-spacing: .04em; background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 14px; display: inline-block; margin-bottom: 28px; word-break: break-all;
  }
  .token b { color: var(--ink); font-weight: 600; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 50px; border-radius: 10px; font-size: 15px; font-weight: 500;
    text-decoration: none; margin-bottom: 10px;
    transition: background-color .2s var(--ease), border-color .2s var(--ease), transform .18s var(--ease);
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-primary:hover { background: #000; }
  .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: rgb(17 17 20 / .24); background: #FAFAFB; }
  a:focus-visible, .btn:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:active { transform: none; } }
</style>
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke-linecap="round" stroke-width="10">
        <line x1="16" y1="35" x2="84" y2="35" stroke="var(--ink)"/>
        <line x1="16" y1="65" x2="84" y2="65" stroke="var(--ink)"/>
        <line x1="35" y1="16" x2="35" y2="84" stroke="var(--ink)"/>
        <line x1="65" y1="16" x2="65" y2="84" stroke="var(--orange)"/>
      </g>
      <!-- Weave, exactly per "Crosses Brand Final": a 2-unit knockout gap where the
           top bar passes in front of the orange vertical and the bottom bar in front
           of the ink vertical. Knockout follows the surface (--bg), ink redrawn on top. -->
      <g fill="none" stroke-linecap="butt">
        <line x1="57" y1="35" x2="73" y2="35" stroke="var(--bg)" stroke-width="14"/>
        <line x1="27" y1="65" x2="43" y2="65" stroke="var(--bg)" stroke-width="14"/>
      </g>
      <g fill="none" stroke-linecap="round">
        <line x1="58" y1="35" x2="72" y2="35" stroke="var(--ink)" stroke-width="10"/>
        <line x1="28" y1="65" x2="42" y2="65" stroke="var(--ink)" stroke-width="10"/>
      </g>
    </svg>
    <div class="eyebrow">Machine tag</div>
    <h1>You tapped a machine tag.</h1>
    <p>Open Crosses to check in and start stringing. Don't have it yet? Install the beta
       from TestFlight, then tap the tag again.</p>
    <div class="token" id="token">machine</div>
    <a class="btn btn-primary" id="open" href="#">Open in Crosses</a>
    <a class="btn btn-ghost" href="https://testflight.apple.com/join/U9NDt4kd">Get Crosses · TestFlight</a>
    <a class="btn btn-ghost" href="/">About Crosses</a>
  </main>
  <script>
    // The machine token is the last path segment (/m/<token>). Show it and offer to reopen the
    // same URL, which the app claims as a Universal Link once installed.
    var token = decodeURIComponent(location.pathname.replace(/^\/m\//, "").replace(/\/$/, "")) || "machine";
    var el = document.getElementById("token");
    el.textContent = "crossesapp.com/m/";
    var b = document.createElement("b");
    b.textContent = token;
    el.appendChild(b);
    document.getElementById("open").setAttribute("href", location.href);
  </script>
</body>
</html>
