<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ============================================================================
     Open Graph / social share card for crossesapp.com — 1200 × 630.

     This is the "C2 · Light" lockup from the Crosses Brand Final sheet, set as a
     social preview: the woven "#" mark beside the CROSSES wordmark with the orange
     STRING TRACKING tagline, on the off-white ground, over the install channel.
     Mark and type are the sheet's C2 ratios scaled 1.25x — the card carries no
     headline, so the lockup is what holds the frame. The one webface it needs is
     vendored (./fonts) so the render is deterministic and offline; nothing here
     touches the network.

     Regenerate the PNG with scripts/build-og.mjs (see that file).
     ========================================================================= */ -->
<style>
  @font-face {
    font-family: 'Martian Mono';
    font-style: normal; font-weight: 400 600; font-display: block;
    src: url('./fonts/martian-mono.woff2') format('woff2');
  }

  :root {
    --bg: #F5F5F7;
    --ink: #111114;
    --orange: #FF4300;
    --ink-64: rgb(17 17 20 / .64);
    --ink-label: rgb(17 17 20 / .62);
    --wordmark: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }

  .card {
    width: 1200px; height: 630px;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- C2 lockup --------------------------------------------------------- */
  .lockup { display: flex; align-items: center; gap: 42.5px; }
  .lockup .mark { width: 160px; height: 160px; flex: none; display: block; }
  .stack { display: flex; flex-direction: column; align-items: flex-start; }
  .wordmark {
    font-family: var(--wordmark); font-weight: 600; font-size: 70px; line-height: 1;
    text-transform: uppercase; letter-spacing: .138em; text-indent: .138em; color: var(--ink);
  }
  .tagline {
    font-family: var(--wordmark); font-weight: 500; font-size: 29.4px; line-height: 1;
    text-transform: uppercase; letter-spacing: .24em; text-indent: .24em;
    color: var(--orange); margin-top: 16.25px;
  }

  /* ---- Channel ----------------------------------------------------------- */
  .footer {
    margin-top: 76px;
    font-family: 'Martian Mono', var(--wordmark);
    font-weight: 500; font-size: 15px; line-height: 1;
    text-transform: uppercase; letter-spacing: .2em; color: var(--ink-label);
    display: inline-flex; align-items: center; gap: 16px;
  }
  .footer .dot { width: 4px; height: 4px; border-radius: 50%; background: rgb(17 17 20 / .32); }
</style>
</head>
<body>
  <div class="card">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke-width="10" stroke-linecap="round">
          <line x1="16" y1="35" x2="84" y2="35" stroke="currentColor"/>
          <line x1="16" y1="65" x2="84" y2="65" stroke="currentColor"/>
          <line x1="35" y1="16" x2="35" y2="84" stroke="currentColor"/>
          <line x1="65" y1="16" x2="65" y2="84" stroke="#FF4300"/>
        </g>
        <!-- 2-unit knockout gap where the top bar passes in front of the orange
             vertical and the bottom bar in front of the ink vertical. -->
        <g fill="none" stroke-linecap="butt">
          <line x1="57" y1="35" x2="73" y2="35" stroke="#F5F5F7" stroke-width="14"/>
          <line x1="27" y1="65" x2="43" y2="65" stroke="#F5F5F7" stroke-width="14"/>
        </g>
        <g fill="none" stroke-linecap="round">
          <line x1="58" y1="35" x2="72" y2="35" stroke="currentColor" stroke-width="10"/>
          <line x1="28" y1="65" x2="42" y2="65" stroke="currentColor" stroke-width="10"/>
        </g>
      </svg>
      <div class="stack">
        <div class="wordmark">Crosses</div>
        <div class="tagline">String tracking</div>
      </div>
    </div>

    <div class="footer">
      <span>crossesapp.com</span>
      <span class="dot" aria-hidden="true"></span>
      <span>Open TestFlight beta</span>
    </div>
  </div>
</body>
</html>
