<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Crosses">
  <!-- The woven "#": ink strokes + ONE orange vertical (the right-hand one).
       Ink uses currentColor so a single file works on light and dark when inlined.
       Exactly the mark from the "Crosses Brand Final" design; matches CrossesLogo
       in crosses-ios/CrossesTheme.swift. -->
  <g stroke-width="10" stroke-linecap="round">
    <line x1="16" y1="35" x2="84" y2="35" stroke="currentColor"/>
    <line x1="16" y1="65" x2="84" y2="65" stroke="currentColor"/>
    <line x1="35" y1="16" x2="35" y2="84" stroke="currentColor"/>
    <line x1="65" y1="16" x2="65" y2="84" stroke="#FF4300"/>
  </g>
  <!-- Weave: the top bar passes in front of the orange vertical and the bottom bar
       in front of the ink vertical, each with a 2-unit knockout gap. The knockout is
       the surface colour (light #F5F5F7 here; override for other surfaces); the ink
       bar is then redrawn on top. -->
  <g stroke-linecap="butt">
    <line x1="57" y1="35" x2="73" y2="35" stroke="#F5F5F7" stroke-width="14"/>
    <line x1="27" y1="65" x2="43" y2="65" stroke="#F5F5F7" stroke-width="14"/>
  </g>
  <g stroke-linecap="round">
    <line x1="58" y1="35" x2="72" y2="35" stroke="currentColor" stroke-width="10"/>
    <line x1="28" y1="65" x2="42" y2="65" stroke="currentColor" stroke-width="10"/>
  </g>
</svg>
