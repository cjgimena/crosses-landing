<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Crosses">
  <!-- The woven "#": ink strokes + ONE orange vertical (the right-hand one).
       Ink uses currentColor so a single file works on light and dark when inlined.
       Matches CrossesLogo in crosses-ios/CrossesTheme.swift exactly. -->
  <g stroke-width="10" stroke-linecap="round">
    <line x1="16" y1="35" x2="84" y2="35" stroke="currentColor"/>
    <line x1="16" y1="65" x2="84" y2="65" stroke="currentColor"/>
    <line x1="35" y1="16" x2="35" y2="84" stroke="currentColor"/>
    <line x1="65" y1="16" x2="65" y2="84" stroke="#FF4300"/>
  </g>
  <!-- Weave: the horizontals pass OVER the orange vertical (top) and over the
       ink vertical (bottom), so the strands alternate like a string bed. -->
  <g stroke-width="10" stroke-linecap="butt">
    <line x1="57" y1="35" x2="73" y2="35" stroke="currentColor"/>
    <line x1="27" y1="65" x2="43" y2="65" stroke="currentColor"/>
  </g>
</svg>
