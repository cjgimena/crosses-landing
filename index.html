<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crosses — String tracking for teams</title>
<meta name="description" content="Know the machine is free before you walk over. Crosses tracks your team's racquet-stringing machines — see what's open, book time, tap in with NFC, and log every job.">
<style>
  :root { color-scheme: light dark;
          --bg:#0c0c0e; --surface:#1b1b1f; --ink:#f3f3f5; --muted:#9a9aa2; --orange:#ff4300; --line:rgba(255,255,255,.10); }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f5f7; --surface:#fff; --ink:#111114; --muted:#6b6b72; --line:rgba(0,0,0,.10); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         text-align: center; padding: 32px; min-height: 100vh; }
  .logo { width: 72px; height: 72px; margin-bottom: 26px; }
  .eyebrow { font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
             letter-spacing: .28em; color: var(--orange); margin-bottom: 20px; }
  h1 { font-size: clamp(28px, 6vw, 44px); letter-spacing: -1px; margin: 0 0 14px; max-width: 16ch; }
  p { color: var(--muted); margin: 0 auto 30px; max-width: 46ch; font-size: 17px; }
  .pill { display: inline-block; font: 600 13px/1 -apple-system, sans-serif;
          color: var(--ink); background: var(--surface); border: 1px solid var(--line);
          border-radius: 999px; padding: 13px 22px; }
  .foot { position: fixed; bottom: 24px; left: 0; right: 0;
          font: 600 10px/1 ui-monospace, monospace; letter-spacing: .28em; color: var(--muted); }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
    <g fill="none" stroke-linecap="round" stroke-width="10">
      <line x1="16" y1="35" x2="84" y2="35" stroke="var(--ink)"/>
      <line x1="16" y1="65" x2="84" y2="65" stroke="var(--ink)"/>
      <line x1="35" y1="16" x2="35" y2="84" stroke="var(--ink)"/>
      <line x1="65" y1="16" x2="65" y2="84" stroke="var(--orange)"/>
    </g>
  </svg>
  <div class="eyebrow">CROSSES · STRING TRACKING</div>
  <h1>Know the machine is free before you walk over.</h1>
  <p>Crosses tracks your team's racquet-stringing machines — see what's open, book your
     time, tap in with NFC, and log every job.</p>
  <span class="pill">iPhone app coming soon</span>
  <div class="foot">TAP · STRING · LOG</div>
</body>
</html>
